template_id: algebra-ratios-equivalent-ratio-unknown-term-v1
domain: algebra
name: equivalent-ratio-unknown-term

description: >
  A real-world scenario establishes a fixed ratio between two quantities
  via one known pair, then gives a new value for one quantity and asks
  the learner to solve for the missing corresponding quantity that keeps
  the ratio equivalent (i.e. solving a:b = c:x for x).

has_image: false
answer_type: numeric

problem_text_templates:
  - "In a recipe, the ratio of flour to sugar is {a} to {b} cups. If a baker uses {c} cups of flour, how many cups of sugar are needed to keep the ratio the same?"
  - "A shade of green paint is mixed from blue and yellow paint in a ratio of {a}:{b}. If {c} liters of blue paint are used, how many liters of yellow paint are needed to match the ratio?"
  - "On a scale drawing, {a} centimeters represents {b} meters of actual length. If a wall measures {c} centimeters on the drawing, how many meters is the wall in real life?"

parameters:
  a:
    type: int
    min: 2
    max: 30
    step: 1
  b:
    type: int
    min: 2
    max: 30
    step: 1
  c:
    type: int
    min: 3
    max: 60
    step: 1
